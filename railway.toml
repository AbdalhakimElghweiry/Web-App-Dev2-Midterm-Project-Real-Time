[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand: let the Dockerfile ENTRYPOINT (docker/entrypoint.sh) run,
# which prepares the app and then exec's the CMD (apache2-foreground).
healthcheckPath = "/up"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
